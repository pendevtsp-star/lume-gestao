name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  django:
    name: Django checks e testes
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key-2026-long-random-value-for-security-checks-9f84a21b
      DEBUG: "False"
      ENVIRONMENT: production
      LUME_STRICT_PRODUCTION: "False"
      ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
      DB_ENGINE: sqlite
      SECURE_SSL_REDIRECT: "False"
      GOOGLE_CALENDAR_SYNC_ENABLED: "True"
      WHATSAPP_DRY_RUN: "True"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit coverage pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Static Python security scan
        run: bandit -r accounts billing checkout config core fiscal homecare lume_connect mobile patients relationships reports scheduling team website -x "*/migrations/*,*/tests/*,*/test_*.py" -ll

      - name: Django checks
        run: python manage.py check

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Django deployment security checks
        env:
          SECURE_SSL_REDIRECT: "True"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
          CSRF_TRUSTED_ORIGINS: https://sistema.clinicafisiolume.com.br
        run: python manage.py check --deploy --fail-level WARNING

      - name: Run tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
        run: |
          coverage run \
            --source=accounts,billing,checkout,core,fiscal,homecare,lume_connect,mobile,patients,relationships,reports,scheduling,team,website \
            manage.py test
          coverage report --fail-under=1
          coverage xml -o coverage.xml
          coverage json -o coverage.json

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: django-coverage
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: warn

      - name: Validate Docker Compose files
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet
          LUME_APP_IMAGE=ghcr.io/pendevtsp-star/lume-gestao/app:ci \
          LUME_WHATSAPP_WEB_IMAGE=ghcr.io/pendevtsp-star/lume-gestao/whatsapp-web:ci \
          docker compose -f docker-compose.prod.yml config --quiet

  whatsapp-web:
    name: WhatsApp Web gateway build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-web-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: whatsapp-web-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci --omit=dev --omit=optional

      - name: Syntax check
        run: node --check src/server.js

      - name: Gateway tests
        run: npm test

      - name: Production dependency audit
        run: npm audit --omit=dev --omit=optional --audit-level=high

  whatsapp-baileys:
    name: WhatsApp Baileys candidate build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-baileys-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: whatsapp-baileys-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Syntax checks
        run: |
          node --check src/server.js
          node --check src/connection.js
          node --check src/auth-store.js
          node --check src/outbound-store.js

      - name: Gateway tests
        run: npm test

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Container install test
        run: docker build --tag lume-whatsapp-baileys:test .
